name = "best-design-curator-worker"
main = "index.js"
compatibility_date = "2026-11-01"

# El 1 y el 15 de cada mes a las 08:00 UTC (09:00 en Madrid en invierno, 10:00 en verano)
[triggers]
crons = ["0 8 1,15 * *"]

[vars]
AGENT_ID       = "agent_018WY2x8bsCxN5HVgLtCiSqA"
ENVIRONMENT_ID = "env_01WTAhnqzernXqwEMjfwbvbd"
ALLOWED_ORIGIN = "https://alejandrozh.github.io"
REPO_URL       = "https://github.com/alejandrozh/Best-Design-AI-Workflow"

# Secretos: NO van aquí. Se configuran una vez con:
#   npx wrangler secret put ANTHROPIC_API_KEY
