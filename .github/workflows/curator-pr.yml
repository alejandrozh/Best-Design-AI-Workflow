# Cuando el agente curador sube una rama curator/AAAA-MM-DD,
# esta acción abre el Pull Request para que Alex lo revise.
name: Abrir PR del curador

on:
  push:
    branches: ['curator/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar content.json
        run: python3 -c "import json; json.load(open('web/content.json', encoding='utf-8'))"
      - name: Abrir PR (si no existe ya)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if gh pr view "$BRANCH" >/dev/null 2>&1; then exit 0; fi
          BODY=$(git log -1 --format=%b)
          gh pr create --base main --head "$BRANCH" \
            --title "Curador: ${BRANCH#curator/}" \
            --body "${BODY:-Propuesta del agente curador. Revisa los cambios en web/content.json y aprueba con Merge.}"
